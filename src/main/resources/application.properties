spring.application.name=vendeai
server.port=8081

# --- Banco de dados (PostgreSQL) ---
spring.datasource.url=${VENDEAI_DB_URL:jdbc:postgresql://localhost:5432/vendeai}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Upload de fotos dos anuncios ---
vendeai.uploads=${VENDEAI_UPLOADS:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- E-mail (codigo de verificacao) ---
# Sem MAIL_HOST, o site roda em modo demonstracao: o codigo aparece na tela e no log.
# Gmail: MAIL_HOST=smtp.gmail.com, MAIL_USERNAME=seu@gmail.com, MAIL_PASSWORD=senha de app (16 letras)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Frete ---
vendeai.frete.valor=19.90
vendeai.frete.gratis-acima-de=79.00
